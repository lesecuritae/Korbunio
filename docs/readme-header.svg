<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">KorbKlar</title>
  <desc id="desc">KorbKlar vergleicht regionale Supermarktangebote von REWE, Kaufland, EDEKA, ALDI und weiteren Händlern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4faf6"/>
      <stop offset="1" stop-color="#dcefe5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="32" fill="url(#bg)"/>
  <circle cx="1100" cy="38" r="180" fill="#c8e5d4" opacity=".62"/>
  <circle cx="42" cy="470" r="150" fill="#ffffff" opacity=".56"/>

  <g transform="translate(82 82)">
    <rect width="104" height="104" rx="26" fill="#116149"/>
    <path d="M25 43h54l-7 38H32l-7-38Z" fill="#fff"/>
    <path d="M36 43c2-14 7-21 16-21s14 7 16 21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="m40 60 7 7 16-18" fill="none" stroke="#116149" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="212" y="150" fill="#14201b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="72" font-weight="760" letter-spacing="-3">Korb<tspan fill="#116149">Klar</tspan></text>
  <text x="84" y="235" fill="#263d33" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="650">Supermarktangebote direkt vergleichen</text>
  <text x="84" y="276" fill="#64736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20">Compare regional supermarket offers</text>
  <text x="84" y="338" fill="#405249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18">Selbst gehostet · regionale Preise · keine LLM erforderlich</text>

  <rect x="670" y="76" width="446" height="326" rx="28" fill="#0a3c2d" opacity=".10"/>
