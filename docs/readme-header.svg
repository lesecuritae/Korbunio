    <rect width="446" height="326" rx="28" fill="#fff" stroke="#d7e5de"/>
    <text x="30" y="46" fill="#63716a" font-size="15" font-weight="700" letter-spacing="1.6">HÄNDLER IM VERGLEICH</text>
    <text x="30" y="78" fill="#8a9791" font-size="14">SUPPORTED RETAILERS</text>

    <g font-size="22" font-weight="720" fill="#163a2d">
