name: korbunio

x-korb-environment: &korb-environment
  SUPERMARKT_DATA_DIR: ${SUPERMARKT_DATA_DIR:-/data}
  SUPERMARKT_CACHE_DB: ${SUPERMARKT_CACHE_DB:-/data/supermarkt-cache.sqlite3}
  SUPERMARKT_SIGNING_SECRET_FILE: ${SUPERMARKT_SIGNING_SECRET_FILE:-/data/.signing-secret}
  SUPERMARKT_SIGNING_SECRET: ${SUPERMARKT_SIGNING_SECRET:-}
  SUPERMARKT_IMAGE_CACHE_DIR: ${SUPERMARKT_IMAGE_CACHE_DIR:-/data/supermarkt-images}
  SUPERMARKT_KAUFLAND_CACHE_DIR: ${SUPERMARKT_KAUFLAND_CACHE_DIR:-/data/kaufland}
  SUPERMARKT_REWE_CACHE_DIR: ${SUPERMARKT_REWE_CACHE_DIR:-/data/rewe}
  SUPERMARKT_USER_AGENT: ${SUPERMARKT_USER_AGENT:-}
  SUPERMARKT_API_KEY: ${SUPERMARKT_API_KEY:-}
  SUPERMARKT_DEFAULT_POSTAL_CODE: ${SUPERMARKT_DEFAULT_POSTAL_CODE:-}
  SUPERMARKT_DEFAULT_RETAILERS: ${SUPERMARKT_DEFAULT_RETAILERS:-}
  SUPERMARKT_CACHE_TTL_MINUTES: ${SUPERMARKT_CACHE_TTL_MINUTES:-30}
  SUPERMARKT_CACHE_WEEKLY: ${SUPERMARKT_CACHE_WEEKLY:-1}
  SUPERMARKT_CACHE_MAX_SNAPSHOTS: ${SUPERMARKT_CACHE_MAX_SNAPSHOTS:-100}
  SUPERMARKT_RESULT_RETENTION_HOURS: ${SUPERMARKT_RESULT_RETENTION_HOURS:-168}
  SUPERMARKT_TIMEOUT_SECONDS: ${SUPERMARKT_TIMEOUT_SECONDS:-25}
  SUPERMARKT_MARKTGURU_PAGE_SIZE: ${SUPERMARKT_MARKTGURU_PAGE_SIZE:-500}
  SUPERMARKT_MAX_WORKERS: ${SUPERMARKT_MAX_WORKERS:-8}
  SUPERMARKT_KAUFLAND_STORE_CACHE_TTL_SECONDS: ${SUPERMARKT_KAUFLAND_STORE_CACHE_TTL_SECONDS:-86400}
  SUPERMARKT_REWE_STORE_CACHE_TTL_SECONDS: ${SUPERMARKT_REWE_STORE_CACHE_TTL_SECONDS:-86400}
  SUPERMARKT_IMAGE_CACHE_TTL_SECONDS: ${SUPERMARKT_IMAGE_CACHE_TTL_SECONDS:-604800}
  SUPERMARKT_IMAGE_CACHE_MAX_BYTES: ${SUPERMARKT_IMAGE_CACHE_MAX_BYTES:-536870912}
  SUPERMARKT_IMAGE_MAX_FILE_BYTES: ${SUPERMARKT_IMAGE_MAX_FILE_BYTES:-4194304}
  CLAWFORGE_INTELLIGENCE_AUTOSTART: "0"
  CLAWFORGE_INTELLIGENCE_BACKEND: ${CLAWFORGE_INTELLIGENCE_BACKEND:-postgres}
  CLAWFORGE_INTELLIGENCE_DB: ${CLAWFORGE_INTELLIGENCE_DB:-/data/clawforge-intelligence.sqlite3}
  CLAWFORGE_POSTGRES_DSN: ${CLAWFORGE_POSTGRES_DSN:-postgresql://clawforge:${CLAWFORGE_POSTGRES_PASSWORD}@postgres:5432/clawforge}
  CLAWFORGE_FEED_TIMEOUT_SECONDS: ${CLAWFORGE_FEED_TIMEOUT_SECONDS:-20}
  CLAWFORGE_WORKER_POLL_SECONDS: ${CLAWFORGE_WORKER_POLL_SECONDS:-5}
  CLAWFORGE_ABUSECH_AUTH_KEY: ${CLAWFORGE_ABUSECH_AUTH_KEY:-}
  CLAWFORGE_VIRUSTOTAL_API_KEY: ${CLAWFORGE_VIRUSTOTAL_API_KEY:-}

services:
  api:
    image: ghcr.io/lesecuritae/korbunio:latest
    build: .
    container_name: korbunio-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment: *korb-environment
    volumes:
      - korbunio-data:/data
    ports:
      - "${SUPERMARKT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  intelligence-worker:
    image: ghcr.io/lesecuritae/korbunio:latest
    build: .
    container_name: korbunio-intelligence-worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "supermarkt.intelligence_worker"]
    environment: *korb-environment
    volumes:
      - korbunio-data:/data
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: korbunio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clawforge
      POSTGRES_USER: clawforge
      POSTGRES_PASSWORD: ${CLAWFORGE_POSTGRES_PASSWORD:?set CLAWFORGE_POSTGRES_PASSWORD}
    volumes:
      - korbunio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawforge -d clawforge"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  korbunio-data:
  korbunio-postgres:
