name: Build Android app

# The published APK is the native Kotlin/Compose application. It has its own
# Room database and talks directly to retailer data sources; the Flutter app
# remains a server-backed compatibility client and is checked separately.

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/korbunio-release.jks

      - name: Build APK
        working-directory: android
        env:
          KORBUNIO_STORE_FILE: /tmp/korbunio-release.jks
          KORBUNIO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KORBUNIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KORBUNIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KORBUNIO_REQUIRE_SIGNED_RELEASE: "true"
        run: ./gradlew assembleRelease

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korbunio-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explain how to install it
        run: |
          {
            echo "### Korbunio app"
            echo
            echo "Download the **korbunio-apk** artifact from this run and install"
            echo "\`app-release.apk\` on the phone. This is the native serverless app."
            echo
            echo "The APK is signed with Korbunio's persistent release key and can"
            echo "be updated by future Korbunio releases without losing app data."
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-compatibility:
    name: Flutter compatibility client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --exclude-tags "golden,live"

  native-quality:
    name: Native Kotlin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build native debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Run native unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug
