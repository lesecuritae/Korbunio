name: Build Android app

# The published APK is the native Kotlin/Compose application. It has its own
# Room database and talks directly to retailer data sources; the Flutter app
# remains a server-backed compatibility client and is checked separately.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "app/**"
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/korbunio-release.jks

      - name: Build APK
        working-directory: android
        env:
          KORBUNIO_STORE_FILE: /tmp/korbunio-release.jks
          KORBUNIO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KORBUNIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KORBUNIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KORBUNIO_REQUIRE_SIGNED_RELEASE: "true"
        run: ./gradlew assembleRelease

      - name: Sign native release APK
        env:
          KORBUNIO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KORBUNIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KORBUNIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          INPUT="$APK_DIR/app-release-unsigned.apk"
          test -f "$INPUT" || INPUT="$APK_DIR/app-release.apk"
          test -f "$INPUT"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" sign \
            --ks /tmp/korbunio-release.jks \
            --ks-pass env:KORBUNIO_STORE_PASSWORD \
            --ks-key-alias "$KORBUNIO_KEY_ALIAS" \
            --key-pass env:KORBUNIO_KEY_PASSWORD \
            --out "$APK_DIR/app-release-signed.apk" "$INPUT"
          mv "$APK_DIR/app-release-signed.apk" "$APK_DIR/app-release.apk"

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: korbunio-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare tagged APK release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          test "$version" = "$declared_version"

          release_apk="korbuino-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$release_apk"
          sha256sum "$release_apk" > "${release_apk}.sha256"
          compatibility_apk="korbunio-${version}.apk"
          cp "$release_apk" "$compatibility_apk"
          sha256sum "$compatibility_apk" > "${compatibility_apk}.sha256"
          awk 'NR == 1 { next } /^# / { exit } { print }' RELEASE_NOTES.md > /tmp/release-notes.md

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import mimetypes
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = "lesecuritae/Korbunio"
          tag = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_TOKEN"]
          version = tag.removeprefix("v")
          asset_paths = [
              Path(f"korbuino-{version}.apk"),
              Path(f"korbuino-{version}.apk.sha256"),
              Path(f"korbunio-{version}.apk"),
              Path(f"korbunio-{version}.apk.sha256"),
          ]
          expected_assets = {path.name for path in asset_paths}
          api_base = f"https://api.github.com/repos/{repository}"
          common_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "Korbuino-Android-Release",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, *, payload=None, body=None, content_type=None):
              headers = dict(common_headers)
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              elif content_type:
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  response_body = error.read().decode("utf-8", errors="replace")
                  if error.code == 404:
                      return error.code, None
                  raise RuntimeError(
                      f"GitHub API {method} {url} failed with HTTP {error.code}: "
                      f"{response_body[:500]}"
                  ) from error

          for path in asset_paths:
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"Release asset is missing or empty: {path}")

          status, existing = request(
              "GET", f"{api_base}/releases/tags/{urllib.parse.quote(tag)}"
          )
          if status == 200:
              existing_assets = {asset["name"] for asset in existing.get("assets", [])}
              if expected_assets == existing_assets:
                  print("Release and both assets already exist.")
                  raise SystemExit(0)
              request("DELETE", f"{api_base}/releases/{existing['id']}")

          release_notes = Path("/tmp/release-notes.md").read_text(encoding="utf-8")
          _, release = request(
              "POST",
              f"{api_base}/releases",
              payload={
                  "tag_name": tag,
                  "target_commitish": os.environ["GITHUB_SHA"],
                  "name": f"Korbuino {tag}",
                  "body": release_notes,
                  "draft": True,
                  "prerelease": False,
              },
          )

          upload_base = release["upload_url"].split("{", 1)[0]
          try:
              for path in asset_paths:
                  content_type = mimetypes.guess_type(path.name)[0] or "application/octet-stream"
                  upload_url = f"{upload_base}?name={urllib.parse.quote(path.name)}"
                  last_error = None
                  for attempt in range(1, 5):
                      try:
                          request(
                              "POST",
                              upload_url,
                              body=path.read_bytes(),
                              content_type=content_type,
                          )
                          last_error = None
                          break
                      except RuntimeError as error:
                          last_error = error
                          if attempt < 4:
                              time.sleep(attempt * 15)
                  if last_error:
                      raise last_error

              request(
                  "PATCH",
                  f"{api_base}/releases/{release['id']}",
                  payload={"draft": False},
              )
              _, published = request(
                  "GET", f"{api_base}/releases/tags/{urllib.parse.quote(tag)}"
              )
              published_assets = {asset["name"] for asset in published.get("assets", [])}
              if expected_assets != published_assets:
                  raise RuntimeError(
                      f"Published release assets differ: {sorted(published_assets)}"
                  )
          except Exception:
              request("DELETE", f"{api_base}/releases/{release['id']}")
              raise

          print(f"Published {tag} with assets: {sorted(published_assets)}")
          PY

      - name: Close issues delivered by this milestone
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: lesecuritae/Korbunio
        run: |
          close_issue() {
            issue="$1"
            comment="$2"
            state="$(gh issue view "$issue" --repo "$GH_REPO" --json state --jq .state)"
            if [ "$state" = "OPEN" ]; then
              gh issue close "$issue" --repo "$GH_REPO" --reason completed --comment "$comment"
            fi
          }

          close_issue 8 "Mit Korbuino v0.1.35 wurden die nativen Händlerabrufe, die REWE-PLZ- und Wochenlogik, die Angebotsvalidierung sowie die Produktbildkette überarbeitet und im Android-Emulator geprüft. Weitere Händlerwünsche können als eigene, klar abgegrenzte Anfrage erfasst werden."
          close_issue 15 "Korbuino v0.1.35 nutzt strukturierte öffentliche bzw. offizielle Datenquellen, wo diese technisch verlässlich verfügbar sind, und hält die native App dabei serverlos. Anbieterabhängige Einschränkungen werden getrennt ausgewiesen statt mit erfundenen Daten überdeckt."
          close_issue 39 "Die Docker-Startseite zeigt ab Korbuino v0.1.35 die laufende Versionsnummer sichtbar im Seitenfuß an."
          close_issue 40 "Das mobile Angebotslayout und das Scrollverhalten wurden in Korbuino v0.1.35 korrigiert und auf Smartphone-Auflösungen sowie im Android-Emulator geprüft."

      - name: Explain how to install it
        run: |
          {
            echo "### Korbuino app"
            echo
            echo "Download the **korbunio-apk** artifact from this run and install"
            echo "\`app-release.apk\` on the phone. This is the native serverless app."
            echo
            echo "The APK is signed with Korbuino's persistent release key and can"
            echo "be updated by future Korbuino releases without losing app data."
          } >> "$GITHUB_STEP_SUMMARY"

  flutter-compatibility:
    name: Flutter compatibility client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --exclude-tags "golden,live"

  native-quality:
    name: Native Kotlin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The runner image already ships the Android SDK; setup-android@v3 fails on
      # the retired "tools" package, so only the needed platform is installed.
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build native debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Run native unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug
